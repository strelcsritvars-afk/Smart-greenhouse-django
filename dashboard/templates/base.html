
<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.84.0">
    <title>{% block title %}Smart Greenhouse{% endblock %}</title>

    <link rel="canonical" href="https://getbootstrap.com/docs/5.0/examples/dashboard/">

    

    <!-- Bootstrap core CSS -->
<link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Icons -->
<link href="{% static 'bootstrap_icons/bootstrap-icons.min.css' %}" rel="stylesheet">    
    <!-- Custom styles for this template -->
    <link href="{% static 'css/dashboard.css' %}" rel="stylesheet">
  </head>
    <body>
    
        <!-- Navigation -->
<header class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
  <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3" href="#">PlantSystem</a>
  <button class="navbar-toggler position-absolute d-md-none collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <input class="form-control form-control-dark w-100 me-4" type="text" placeholder="Search" aria-label="Search">
  <div class="navbar-nav pe-4">
    <div class="nav-item text-nowrap">
        <button id="theme-toggle" class="btn btn-sm theme-toggle-float" type="button" aria-label="Switch to dark mode" title="Switch theme">
            <i class="bi bi-moon-fill" aria-hidden="true"></i>
        </button>
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-secondary" type="submit">
            Logout
          </button>
        </form>
    </div>
  </div>
</header>

<div class="container-fluid">
  <div class="row">
    <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
      <div class="position-sticky pt-3">
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
              <span data-feather="home"></span>
              Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'tasks' %}active{% endif %}" href="#">
              <span data-feather="clipboard"></span>
              Tasks
            </a>
            </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'plants' %}active{% endif %}" href="{% url 'plants' %}">
              <span data-feather="feather"></span>
              Plants
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'controllers' %}active{% endif %}" href="{% url 'controllers' %}">
              <span data-feather="hard-drive"></span>
              Controllers
            </a>
          </li>
        </ul>
    </div>
</nav>

    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
    {% block content %}
    {% endblock %}
    </main>

    <script src="{% static 'bootstrap/js/bootstrap.bundle.js' %}"></script>

    <script src="{% static 'js/chart.min.js' %}"></script>
    <script src="{% static 'bootstrap/js/feather.min.js' %}"></script>
    <script src="{% static 'js/dashboard.js' %}"></script>
    </body>
</html>
